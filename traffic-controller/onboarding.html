<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 50px auto; text-align: center; line-height: 1.5; color: #333; }
    .box { border: 1px solid #ddd; padding: 30px; border-radius: 15px; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; }
    button { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .danger-zone { margin-top: 30px; border-top: 1px dashed #ccc; padding-top: 20px; }
    .reset-btn { background: #dc3545; font-size: 0.85em; padding: 8px 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚦 Traffic Controller</h1>
    <p>Activate the <b>Gatekeeper</b> to block third-party traffic by default. Use the side panel to manage live requests.</p>
    
    <button id="activate">Activate Gatekeeper</button>

    <div class="danger-zone">
      <p style="font-size: 0.85em; color: #666;">Site behaving strangely? Start over.</p>
      <button id="reset" class="reset-btn">Reset All Rules</button>
    </div>
  </div>
  <script src="browser-polyfill.min.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
